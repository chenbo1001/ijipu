[package]
name = "jianpuscript"
version = "0.1.0"
description = "JianpuScript — 码上简谱：代码式简谱制谱引擎"
authors = ["JianpuScript Dev"]
edition = "2021"

[lib]
name = "jianpuscript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
