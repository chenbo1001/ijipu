[package]
name = "ijipu"
version = "0.1.0"
description = "iJipu — 爱记谱：代码式简谱制谱引擎"
authors = ["iJipu Dev"]
edition = "2021"

[lib]
name = "ijipu_lib"
# 注：桌面端仅需 rlib（main.rs 静态链接）；cdylib 在 x86_64-pc-windows-gnu 下
# 因导出符号超 PE 序号上限（>65535）导致 MinGW ld 报 "export ordinal too large"，
# 且桌面版不使用该 DLL（见 tauri#10843 / rust#92212），故移除 cdylib。
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# adj538：单实例——第二次双击 .jps 时不再开新进程，而是把路径交给已有窗口并置前。
# 官方插件（tauri-apps/plugins-workspace），仅 Rust 依赖、无需 npm 包与 ACL 权限。
tauri-plugin-single-instance = "2"
# adj568：桌面端工作区改用**原生文件夹选择器** + **按路径读写**。
# 为什么必须换掉网页版那条路：Chromium 的 File System Access **敏感目录黑名单**
# 把「下载 / 桌面 / 文档 / 用户主目录」**整个目录**列为不可授予（子文件夹才放行），
# 且该拦截在网页层无 API 可绕过、报错还是与"用户取消"无法区分的 AbortError
# （见 E-2026-271）。桌面壳里我们不需要受这条 Web 安全策略约束，直接用原生选择器取
# **磁盘路径**，再用 Rust 侧 fs 操作即可；顺带消除"重开要重新授权"。
# 同样只作 Rust 依赖（自定义 command 调用），无需 npm 包与 ACL 权限。
tauri-plugin-dialog = "2"
# adj652：**用系统浏览器打开外部链接**（谱面文本里的 URL，如 S: 谱尾说明里的官网）。
# 为什么必须加它：桌面壳是 WebView2，`window.open` / `target="_blank"` 会走 NewWindowRequested，
# 而 Tauri 默认**不建新窗口也不交给系统**（wry 只在宿主注册了 handler 时才拦截，否则行为不确定）
# ⇒ 预览里点链接会"没反应"。opener 插件的 `open_url` 直接调系统默认浏览器。
# 前端走 `window.__TAURI__.core.invoke('plugin:opener|open_url', { url })`（无需 npm 包），
# ACL 权限写在 `capabilities/default.json` 的 `opener:allow-open-url`。
tauri-plugin-opener = "2"

# adj875：命令行（`@ijipu/cli`）的**能力宿主** —— Windows 命名管道服务端（见 `src/cli_host.rs`）。
# 为什么需要：`render -t png|jpg|pdf`（canvas/字体/分页）与 `play -t wav`（AudioContext + 音色库）
# 只在应用里有 ⇒ 应用对外只暴露**能力**（rasterize/synthesize），CLI 要时连管道来取。
# ⚠ 选 `windows-sys` 的依据：① 微软官方 Win32 绑定，纯 `extern "system"` 声明（编译期零成本、不引 DLL）；
# ② tauri/tao/wry **已经把它带进依赖树**（Cargo.lock 里已有 0.61.2）⇒ 加为直接依赖**不新增任何 crate** ✓；
# ③ 走 `[target.'cfg(windows)']` ⇒ 非 Windows 目标（Android 等）根本不编译它 ✓。
# ⚠ adj944 再追加两个 feature（**仍是同一个 crate、没有新增任何依赖** ✓，见 `src/cli_path.rs`）：
#   · `Win32_System_Registry` —— 注册 iJipu CLI 要读写 `HKCU\Environment\Path`（写前备份 + 回读校验）
#     与 App Paths；用官方绑定比自己拼 `reg.exe` 命令行稳（转义/编码/回读都要自己造 ✗）；
#   · `Win32_UI_WindowsAndMessaging` —— 写完广播 `WM_SETTINGCHANGE`（`SendMessageTimeoutW`），
#     让**新起的进程**看到新 PATH（已开着的终端看不到，见 `docs/CLI.md` 的说明）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

# adj942（用户裁定「直接落，修」·路线②）：把**命令行内嵌进 `ijipu.exe`** —— 用嵌入的小 JS 引擎
# 跑 `packages/ijipu-cli` 那段纯逻辑（`runCli(argv, io)`），用户**不必装 Node**。
#
# ⚠ 选 `rquickjs`（而不是 boa / quickjs-rs / deno_core / v8）的依据：
#   ① **体积**：QuickJS 是"一个 C 文件级"的小引擎（编译后静态库约 1MB 级），本仓库要的是
#      "安装包增量 0.5~1MB 量级"；V8/deno_core 光运行时就几十 MB ✗；
#   ② **维护活跃 + 跨平台可编**：rquickjs 是 QuickJS-ng 的官方 Rust 绑定（0.14.0 / 2026-09），
#      自带 `rquickjs-sys` 里 vendored 的 quickjs-ng 源码，构建走 `cc` crate ⇒ 本仓库的
#      **x86_64-pc-windows-gnu（MinGW gcc）** 能直接编（MSVC 亦可）；
#   ③ **API 够用**：宿主函数注入（`Function::new`）+ 微任务队列（`execute_pending_job`）
#      ⇒ 把 `io` 全部交给 Rust 提供，**不在 JS 里硬造 `node:fs`** ✓（口径见 `docs/CLI.md` §一之二）。
# ⚠ 只挂在 `cfg(windows)` 下：本轮交付物是 `ijipu.exe`；非 Windows 目标（Android 等）**不编译它** ✓。
#   同时给 `windows-sys` 开 `Win32_System_Console`（AttachConsole/AllocConsole/GetConsoleMode/
#   WriteConsoleW）—— 这是**已有依赖加 feature**，不新增任何 crate ✓。
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
