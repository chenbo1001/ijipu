<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动态谱预览（调试）</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: #0f1526;
        color: #e8eefc;
        font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; opacity: 0.9; }
      .stage {
        position: relative;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      }
      canvas { display: block; height: min(78vh, 900px); width: auto; }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        width: min(100%, 720px);
      }
      button, select {
        background: #1b2545;
        color: #e8eefc;
        border: 1px solid #33406b;
        border-radius: 6px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #24305a; }
      input[type="range"] { flex: 1; accent-color: #00f0ff; }
      .meta { font-variant-numeric: tabular-nums; opacity: 0.8; white-space: nowrap; }
      .hint { opacity: 0.55; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>动态谱预览（调试页 · 不进构建）</h1>
    <div class="stage"><canvas id="view"></canvas></div>
    <div class="bar">
      <button id="play">播放</button>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <span class="meta" id="meta">0.0s</span>
    </div>
    <div class="bar">
      <select id="preset">
        <option value="9x16">竖屏 9:16</option>
        <option value="1x1">正方形 1:1</option>
        <option value="16x9">横屏 16:9</option>
      </select>
      <span class="hint" id="hint"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
