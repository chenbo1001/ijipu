<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/Jianpu.ico" />
    <link rel="icon" type="image/png" href="/Jianpu.png" />
    <!-- adj403：interactive-widget=resizes-content —— 让**已安装的 PWA** 在软键盘弹出时
         与浏览器一样收缩内容区（Chrome 108+）。默认 PWA 只缩"视觉视口"、布局视口不变，
         于是键盘会盖住编辑区底部（用户反馈"用 PWA 时窗口不随输入法缩小，只能用浏览器"）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="爱记谱 iJipu —— 码即成，谱自现。代码式简谱制谱引擎，脚本规则高度兼容「番茄简谱」。" />
    <!-- adj373：作者署名（页面元数据） -->
    <meta name="author" content="蜗牛🐌" />
    <title>爱记谱 iJipu — 码即成，谱自现</title>
    <!-- adj155：PWA 可安装为浏览器应用 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E2A5E" />
    <meta name="apple-touch-icon" href="/pwa-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="i记谱" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
