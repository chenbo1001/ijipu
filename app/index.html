<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icons/Jianpu.ico" />
    <link rel="icon" type="image/png" href="/icons/Jianpu.png" />
    <!-- adj403：interactive-widget=resizes-content —— 让**已安装的 PWA** 在软键盘弹出时
         与浏览器一样收缩内容区（Chrome 108+）。默认 PWA 只缩"视觉视口"、布局视口不变，
         于是键盘会盖住编辑区底部（用户反馈"用 PWA 时窗口不随输入法缩小，只能用浏览器"）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="爱记谱 iJipu —— 码即成，谱自现。代码式简谱制谱引擎，脚本规则高度兼容「番茄简谱」。" />
    <!-- adj373：作者署名（页面元数据） -->
    <meta name="author" content="蜗牛🐌" />
    <!-- adj621：浏览器页签标题。静态部分 = JS 挂载前的占位（几十毫秒），
         React mount 后会用 `brand/version.ts` 的 `APP_TITLE_FULL` 覆盖为完整形式
         `爱记谱 iJipu - v0.36.0 (2026-09-23 @4ed877a3)`，与 PWA 页签 / Tauri 桌面窗口标题一致。
         此处只写不带版本的前缀，避免每次 `GIT_COMMIT` 变化让 index.html 出现无意义 diff。 -->
    <title>爱记谱 iJipu</title>
    <!-- adj155：PWA 可安装为浏览器应用 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E2A5E" />
    <meta name="apple-touch-icon" href="/icons/pwa-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="i记谱" />
  </head>
  <body>
    <!--
      adj876（官网分层）：**应用入口从 `/` 搬到了 `/app/`**（本文件）。
      根 `index.html` 现在是介绍首页。三处与本入口耦合的地方必须一起改，否则会坏：
        · `vite.config.ts` 的 `build.rollupOptions.input`（要把它当一个入口列出）
        · `vite.config.embed.mjs` 的 `input`（Obsidian 嵌入版也用这个入口，否则插件里会显示首页）
        · `src-tauri/tauri.conf.json` 的 `app.windows[0].url`（桌面壳同理）
      资源引用一律用**绝对路径**（`/assets/...`），因此 `/app/` 这种子路径在
      Cloudflare Pages、PWA、桌面壳（`http://tauri.localhost/`）三处都正常。
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
